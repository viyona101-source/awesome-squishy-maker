<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Squishy Maker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  /* A daisy meadow fills the page; a cream card floats on it: stage on top, step controls below */
  --meadow:#c4eed2;
  --cream:#fffaf3;
  --ink:#5b3a5e;
  --pink:#ff7fb5;
  --pink-soft:#ffe3ef;
  --go:#2ec463;
  --display:"Fredoka","Baloo 2","Comic Sans MS",system-ui,sans-serif;
  --body:"Nunito","Trebuchet MS",system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%;margin:0}
body{background:var(--meadow);color:var(--ink);font-family:var(--body);overflow:hidden;-webkit-tap-highlight-color:transparent}
#meadow{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block}
.app{position:relative;z-index:1;height:100%;display:flex;justify-content:center;padding:14px 16px;box-sizing:border-box}
.card{overflow:clip;position:relative;width:min(580px,100%);height:100%;max-height:900px;display:flex;flex-direction:column;background:rgba(255,250,243,.93);border:4px solid #fff;border-radius:34px;box-shadow:0 8px 0 rgba(91,58,94,.10),0 24px 50px rgba(40,110,70,.22);overflow:hidden}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px 4px}
h1{margin:0;font-family:var(--display);font-weight:700;font-size:clamp(22px,5.4vw,30px);line-height:1.1;text-wrap:balance;letter-spacing:.3px}
h1 span{color:var(--pink)}
.mute{flex:none;width:42px;height:42px;border-radius:50%;border:3px solid var(--pink-soft);background:#fff;color:var(--ink);font:700 18px var(--display);cursor:pointer}
.steps{list-style:none;margin:0;padding:6px 14px 10px;display:flex;gap:6px;justify-content:space-between}
.steps li{flex:1;min-width:0;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:4px;padding:5px 4px;border-radius:999px;background:#fff;font:700 clamp(10px,2.6vw,13px) var(--body);color:#a58aa6;border:2px solid #f3e6f0;white-space:nowrap}
.steps li b{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:#f3e6f0;color:#fff;font-size:11px}
.steps li.cur{background:var(--pink-soft);color:var(--ink);border-color:var(--pink)}
.steps li.cur b{background:var(--pink)}
.steps li.ok{color:#2b8a50;border-color:#bfeccd;background:#f0fbf3}
.steps li.ok b{background:var(--go)}
.stage{position:relative;flex:1 1 auto;min-height:210px;margin:0 12px;border-radius:26px;background:radial-gradient(circle at 50% 38%,#ffffff 0%,#fff3f8 55%,#ffe6f1 100%);touch-action:none;overflow:hidden;cursor:pointer}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.hint{position:absolute;left:50%;bottom:14%;font-size:46px;margin-left:-23px;pointer-events:none;animation:swipe 1.5s ease-in-out infinite;filter:drop-shadow(0 4px 0 rgba(91,58,94,.15))}
.hint[hidden]{display:none}
@keyframes swipe{0%{transform:translateY(40px);opacity:0}20%{opacity:1}80%{opacity:1}100%{transform:translateY(-90px);opacity:0}}
.toast{position:absolute;left:50%;top:12px;transform:translate(-50%,-70px);background:var(--pink);color:#fff;font:600 17px var(--display);padding:8px 18px;border-radius:999px;box-shadow:0 4px 0 #e05f98;transition:transform .35s cubic-bezier(.3,1.6,.5,1);white-space:nowrap;pointer-events:none;max-width:90%;overflow:hidden;text-overflow:ellipsis}
.toast.show{transform:translate(-50%,0)}
.panel{flex:0 1 auto;min-height:0;overflow-y:auto;padding:12px 16px 16px;display:flex;flex-direction:column;gap:10px}
.panel h2{margin:0;font:600 clamp(18px,4.4vw,21px)/1.2 var(--display);text-wrap:balance}
.sub{margin:-4px 0 0;font-size:14px;color:#8a6d8c}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.btn{font:600 18px var(--display);border:none;border-radius:999px;padding:11px 22px;cursor:pointer;transition:transform .12s,box-shadow .12s,opacity .2s}
.btn:active:not(:disabled){transform:translateY(3px)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,.sw:focus-visible,.face:focus-visible,.mute:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.next{background:var(--pink);color:#fff;box-shadow:0 5px 0 #e05f98}
.next:active:not(:disabled){box-shadow:0 2px 0 #e05f98}
.ghost{background:#fff;color:var(--ink);box-shadow:0 5px 0 #f1d9e6;border:2px solid #f6e2ec}
.ghost:active{box-shadow:0 2px 0 #f1d9e6}
.ghost[aria-pressed="true"]{border-color:var(--pink);background:var(--pink-soft)}
.done{width:100%;background:var(--go);color:#fff;font-size:26px;font-weight:700;letter-spacing:1px;padding:13px;box-shadow:0 6px 0 #1e9447}
.done:active:not(:disabled){box-shadow:0 2px 0 #1e9447}
.swatches{display:grid;grid-template-columns:repeat(auto-fit,minmax(56px,1fr));gap:8px}
.sw{display:flex;flex-direction:column;align-items:center;gap:5px;background:none;border:none;padding:4px 0;cursor:pointer;font:700 12px var(--body);color:var(--ink);border-radius:16px}
.sw i{display:block;width:44px;height:44px;border-radius:14px;border:3px solid #fff;box-shadow:0 0 0 2px rgba(91,58,94,.14),inset -4px -6px 0 rgba(0,0,0,.08),inset 5px 5px 0 rgba(255,255,255,.35);transition:transform .2s cubic-bezier(.3,1.8,.5,1)}
.sw:hover i{transform:scale(1.08)}
.sw[aria-pressed="true"] i{transform:scale(1.15);box-shadow:0 0 0 3px var(--ink),inset -4px -6px 0 rgba(0,0,0,.08)}
.faces{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.face{display:flex;flex-direction:column;align-items:center;gap:2px;background:#fff;border:3px solid #f6e7ef;border-radius:18px;padding:4px 0 6px;cursor:pointer;font:700 clamp(10px,2.5vw,12px) var(--body);color:var(--ink);min-width:0}
.face canvas{width:60px;height:60px;max-width:100%}
.wordbox{font:600 22px var(--display);color:var(--ink);text-align:center;border:3px solid var(--pink-soft);border-radius:999px;padding:10px 16px;background:#fff;outline:none;width:100%;box-sizing:border-box}
.wordbox:focus{border-color:var(--pink)}
.wordbox::placeholder{color:#c9b3c9}
.face.word{font:600 clamp(11px,2.9vw,16px) var(--display);letter-spacing:-.2px;padding:14px 2px;min-height:52px;justify-content:center;white-space:nowrap;overflow:hidden}
.face[aria-pressed="true"]{border-color:var(--pink);background:var(--pink-soft)}
.meter{height:18px;border-radius:999px;background:#fff;border:3px solid var(--pink-soft);overflow:hidden}
.meter span{display:block;height:100%;width:0;background:repeating-linear-gradient(-45deg,#ffd0e4 0 10px,#ffb3d3 10px 20px);border-radius:999px;transition:width .1s}
.choose{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pick{display:flex;flex-direction:column;align-items:center;gap:4px;background:#fff;border:3px solid #f6e2ec;border-radius:24px;padding:10px 6px 12px;cursor:pointer;font:600 20px var(--display);color:var(--ink);box-shadow:0 5px 0 #f1d9e6;transition:transform .12s}
.pick:hover{border-color:var(--pink)}
.pick:active{transform:translateY(3px);box-shadow:0 2px 0 #f1d9e6}
.pick:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.pick canvas{width:96px;height:96px}
.pick small{font:700 12px var(--body);color:#8a6d8c}
.topbtns{display:flex;gap:6px;align-items:center;flex-wrap:nowrap;margin-left:auto}
.top{flex-wrap:wrap;row-gap:6px}
.topbtns .colbtn{height:38px;font-size:14px;padding:0 10px}
.topbtns .mute{width:38px;height:38px;font-size:16px}
.colbtn .star{display:none}
@media (max-width:440px){.steps{gap:4px}.steps li b{display:none}.colbtn .lbl{display:none}.colbtn .star{display:inline}.topbtns .colbtn{padding:0 9px}}
.restart{color:#e05f98}
.topbtns .talk{background:var(--pink);border-color:var(--pink);color:#fff;box-shadow:0 3px 0 #e05f98}
.bubble{position:absolute;left:50%;z-index:7;max-width:min(88%,420px);background:#fff;color:var(--ink);font:600 18px/1.25 var(--display);text-align:center;padding:10px 16px;border-radius:22px;border:3px solid var(--pink);box-shadow:0 5px 0 rgba(224,95,152,.35);transform:translate(-50%,8px) scale(.85);opacity:0;pointer-events:none;transition:transform .3s cubic-bezier(.3,1.6,.5,1),opacity .2s;text-wrap:balance}
.bubble.show{transform:translate(-50%,0) scale(1);opacity:1}
.bubble::after{content:"";position:absolute;left:50%;bottom:-12px;margin-left:-10px;border:10px solid transparent;border-top-color:var(--pink);border-bottom:0}
.colbtn{flex:none;height:42px;border-radius:999px;border:3px solid var(--pink-soft);background:#fff;color:var(--ink);font:600 15px var(--display);padding:0 12px;cursor:pointer;display:flex;align-items:center;gap:6px;white-space:nowrap}
.colbtn b{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 5px;box-sizing:border-box;border-radius:999px;background:var(--pink);color:#fff;font-size:13px}
.colbtn:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.save{background:var(--go);color:#fff;box-shadow:0 5px 0 #1e9447;width:100%;font-size:21px}
.save:active:not(:disabled){box-shadow:0 2px 0 #1e9447}
.save:disabled{opacity:1;background:#f0fbf3;color:#2b8a50;box-shadow:none;border:2px solid #bfeccd;cursor:default}
.shelf{position:absolute;left:0;right:0;bottom:0;top:0;z-index:5;background:var(--cream);display:flex;flex-direction:column;border-radius:0 0 30px 30px;overflow:hidden;border-top:2px solid #f6e2ec}
.shelf[hidden]{display:none}
.shelf-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px 6px}
.shelf-head h2{margin:0;font:700 clamp(21px,5vw,26px)/1.1 var(--display)}
.shelf-head h2 span{color:var(--pink)}
.shelf-note{margin:0 16px 8px;font-size:13px;color:#8a6d8c}
.shelf-grid{flex:1;overflow-y:auto;padding:6px 14px 18px;display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px;align-content:start}
.tile{position:relative;background:linear-gradient(#fff,#fff6fa);border:3px solid #f6e2ec;border-radius:22px;padding:6px 4px 9px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;box-shadow:0 4px 0 #f1d9e6;font:inherit;color:var(--ink)}
.tile canvas{width:104px;height:104px}
.tile .nm{font:600 15px var(--display);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 4px}
.tile .kd{font:700 11px var(--body);color:#a58aa6}
.tile:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.rm{position:absolute;top:5px;right:5px;height:26px;min-width:26px;border-radius:999px;border:2px solid #f6e2ec;background:#fff;color:#b07aa8;font:700 13px var(--display);cursor:pointer;padding:0 7px}
.rm.sure{background:#ff5c6c;border-color:#ff5c6c;color:#fff}
.chat{position:absolute;left:0;right:0;bottom:0;top:0;z-index:6;background:var(--cream);display:flex;flex-direction:column;border-radius:0 0 30px 30px;overflow:hidden;border-top:2px solid #f6e2ec}
.chat[hidden]{display:none}
.chat-head{display:flex;align-items:center;gap:10px;padding:8px 14px 4px}
.chat-head canvas{width:84px;height:84px;flex:none}
.chat-head .who{flex:1;min-width:0}
.chat-head .who b{display:block;font:700 20px/1.1 var(--display);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat-head .who small{font:700 12px var(--body);color:#8a6d8c}
.msgs{flex:1;overflow-y:auto;padding:8px 14px 10px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:82%;padding:9px 14px;border-radius:20px;font:600 17px/1.3 var(--display);white-space:pre-wrap;overflow-wrap:anywhere;animation:pop .25s cubic-bezier(.3,1.6,.5,1)}
.msg.sq{align-self:flex-start;background:#fff;border:3px solid var(--pink-soft);border-bottom-left-radius:6px}
.msg.me{align-self:flex-end;background:var(--pink);color:#fff;border-bottom-right-radius:6px;box-shadow:0 3px 0 #e05f98}
.msg.note{align-self:center;background:none;color:#8a6d8c;font:700 13px var(--body);text-align:center;padding:2px 8px}
.msg.dots span{display:inline-block;width:8px;height:8px;margin:0 2px;border-radius:50%;background:#e9b6cf;animation:dot 1s infinite}
.msg.dots span:nth-child(2){animation-delay:.15s}.msg.dots span:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,100%{transform:translateY(0);opacity:.5}50%{transform:translateY(-5px);opacity:1}}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 14px 8px;scrollbar-width:none}
.chips button{flex:none;font:600 14px var(--display);color:var(--ink);background:#fff;border:2px solid #f6e2ec;border-radius:999px;padding:6px 12px;cursor:pointer}
.chips button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.send{display:flex;gap:8px;padding:0 14px 14px}
.send input{flex:1;min-width:0;font:600 18px var(--display);color:var(--ink);border:3px solid var(--pink-soft);border-radius:999px;padding:10px 16px;background:#fff;outline:none}
.send input:focus{border-color:var(--pink)}
.send input::placeholder{color:#c9b3c9}
.send .btn{padding:10px 18px}
.mic{touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;flex:none;width:52px;height:52px;border-radius:50%;border:3px solid var(--pink-soft);background:#fff;font-size:24px;cursor:pointer;display:grid;place-items:center;box-shadow:0 4px 0 #f1d9e6;padding:0}
.mic:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.mic.kb{background:#fff7d6;border-color:#ffe08a}
.mic.on{transform:scale(1.15);background:#ff5c6c;border-color:#ff5c6c;box-shadow:0 0 0 0 rgba(255,92,108,.55);animation:rec 1.2s infinite}
@keyframes rec{0%{box-shadow:0 0 0 0 rgba(255,92,108,.55)}100%{box-shadow:0 0 0 14px rgba(255,92,108,0)}}
.msg.tip{align-self:stretch;max-width:none;background:#fff7d6;border:3px solid #ffe08a;color:var(--ink);font:600 15px/1.35 var(--display);border-radius:18px}
@media (prefers-reduced-motion: reduce){.mic.on{animation:none}}
@media (prefers-reduced-motion: reduce){.msg{animation:none}.msg.dots span{animation:none}}
.empty{grid-column:1/-1;text-align:center;padding:30px 16px;color:#8a6d8c;font-size:15px}
.empty b{display:block;font:600 21px var(--display);color:var(--ink);margin-bottom:6px}
.stats{justify-content:space-between;font:600 16px var(--display)}
.stats span{background:#fff;border-radius:999px;padding:6px 14px;border:2px solid #f6e2ec}
.goalbox{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.chipx{display:inline-flex;align-items:center;gap:6px;background:#fff;border:2px solid #f6e2ec;border-radius:999px;padding:5px 12px 5px 6px;font:600 16px var(--display)}
.chipx i{width:22px;height:22px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1.5px rgba(91,58,94,.18)}
.result{background:#fff;border:3px solid var(--pink-soft);border-radius:22px;padding:10px 14px;display:flex;flex-direction:column;gap:6px}
.result.win{border-color:#bfeccd;background:#f0fbf3}
.result .stars{font:700 30px/1 var(--display);color:#ffc93a;letter-spacing:4px;text-shadow:0 2px 0 rgba(91,58,94,.15)}
.result .stars s{text-decoration:none;color:#eadbe6}
.result b{font:600 20px var(--display)}
.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px;font:700 14px var(--body)}
.checks .ok{color:#2b8a50}
.checks .no{color:#c2457e}
.pick.big{font-size:21px}
.catchbtn{width:100%;background:#4aa6ff;color:#fff;box-shadow:0 5px 0 #2f7fd1;font-size:21px}
.catchbtn:active:not(:disabled){box-shadow:0 2px 0 #2f7fd1}
.breakbtn{width:100%;background:#ff9a3c;color:#fff;box-shadow:0 5px 0 #d97a1f;font-size:21px}
.breakbtn:active:not(:disabled){box-shadow:0 2px 0 #d97a1f}
.meter.brk span{background:repeating-linear-gradient(-45deg,#ffc27a 0 10px,#ff8a6b 10px 20px)}
.towerbtn{width:100%;background:#b56cff;color:#fff;box-shadow:0 5px 0 #8a45d1;font-size:21px}
.towerbtn:active:not(:disabled){box-shadow:0 2px 0 #8a45d1}
.lives{color:#ff5c8a;letter-spacing:2px}
.lives s{text-decoration:none;color:#eadbe6}
.card.arena{width:min(1000px,100%);max-height:none}
.card.arena .steps{display:none}
.card.arena .panel{padding:8px 16px 12px;gap:8px}
.bowlbtn{width:100%;background:#2ec463;color:#fff;box-shadow:0 5px 0 #1e9447;font-size:21px}
.bowlbtn:active:not(:disabled){box-shadow:0 2px 0 #1e9447}
.hoopbtn{width:100%;background:#ff7a59;color:#fff;box-shadow:0 5px 0 #d9573a;font-size:21px}
.hoopbtn:active:not(:disabled){box-shadow:0 2px 0 #d9573a}
.crackbtn{width:100%;background:#7fc8f8;color:#fff;box-shadow:0 5px 0 #4fa3d9;font-size:21px}
.crackbtn:active:not(:disabled){box-shadow:0 2px 0 #4fa3d9}
.mysterybtn{width:100%;background:linear-gradient(90deg,#ff8fc4,#b88cff);color:#fff;box-shadow:0 5px 0 #9a64d6;font-size:21px}
.mysterybtn:active:not(:disabled){box-shadow:0 2px 0 #9a64d6}
.tradebtn{width:100%;background:#ffb347;color:#fff;box-shadow:0 5px 0 #e08a1e;font-size:21px}
.tradebtn:active:not(:disabled){box-shadow:0 2px 0 #e08a1e}
.angrybtn{width:100%;background:#ff6b6b;color:#fff;box-shadow:0 5px 0 #d94848;font-size:21px}
.angrybtn:active:not(:disabled){box-shadow:0 2px 0 #d94848}
@media (prefers-reduced-motion: reduce){.hint{animation:none;bottom:30%}.toast{transition:none}}
</style>
</head>
<body>
<canvas id="meadow" aria-hidden="true"></canvas>
<div class="app">
  <main class="card">
    <div class="top">
      <h1><span>Squishy</span> Maker</h1>
      <div class="topbtns">
        <button class="colbtn talk" id="talkBtn" aria-label="Make your squishy talk">💬 Talk</button>
        <button class="colbtn restart" id="restartBtn" aria-label="Restart the game">↺ Restart</button>
        <button class="colbtn" id="colBtn" aria-label="My collection"><span class="lbl">My collection</span><span class="star" aria-hidden="true">★</span> <b id="colCount">0</b></button>
        <button class="mute" id="mute" aria-label="Turn sound off" title="Sound">♪</button>
      </div>
    </div>
    <ol class="steps" id="steps">
      <li><b>1</b>Color</li><li><b>2</b>Glitter</li><li><b>3</b>Wrap</li><li><b>4</b>Face</li><li><b>5</b>Done</li>
    </ol>
    <div class="stage" id="stageWrap">
      <canvas id="stage" aria-label="Your squishy"></canvas>
      <div class="hint" id="hint" hidden>👆</div>
      <div class="toast" id="toast" role="status"></div>
    </div>
    <section class="panel" id="panel" aria-live="polite"></section>
    <div class="bubble" id="bubble" role="status" aria-live="polite"></div>
    <section class="chat" id="chat" hidden aria-label="Talk with your squishy">
      <div class="chat-head">
        <canvas id="chatPet" width="168" height="168" aria-hidden="true"></canvas>
        <div class="who"><b id="chatName">Your squishy</b><small id="chatSub">Type to talk with me!</small></div>
        <button class="btn ghost" id="chatBack">Back</button>
      </div>
      <div class="msgs" id="msgs" aria-live="polite"></div>
      <div class="chips" id="chips"></div>
      <form class="send" id="sendForm" autocomplete="off">
        <button class="mic" id="micBtn" type="button" aria-label="Hold to talk" title="Hold to talk">🎤</button>
        <input id="chatInput" type="text" maxlength="200" placeholder="Hold 🎤 to talk, or type..." aria-label="Your message" enterkeyhint="send">
        <button class="btn next" id="sendBtn" type="submit">Send</button>
      </form>
    </section>
    <section class="shelf" id="shelf" hidden aria-label="My collection">
      <div class="shelf-head"><h2><span>My</span> Collection</h2><button class="btn ghost" id="shelfBack">Back</button></div>
      <p class="shelf-note" id="shelfNote">Tap a squishy to squish it.</p>
      <div class="shelf-grid" id="shelfGrid"></div>
    </section>
  </main>
</div>

<script>
(() => {
const TAU = Math.PI * 2, INK = '#5b3a5e';
const $ = s => document.querySelector(s);
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[(Math.random() * a.length) | 0];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

/* ---------- data ---------- */
const RAINBOW = ['#ff5c6c', '#ff9a3c', '#ffd83a', '#52d87f', '#4aa6ff', '#6f6bff', '#b56cff'];
const COLORS = [
  { name: 'Red', c: '#ff5c6c' }, { name: 'Orange', c: '#ff9a3c' }, { name: 'Yellow', c: '#ffd83a' },

/* ---------- daisy meadow background ---------- */
const meadow = $('#meadow'), mctx = meadow.getContext('2d');

    c.save(); c.rotate(i / petals * TAU);
    c.beginPath(); c.ellipse(0, -N * 0.25, N * 0.075, N * 0.2, 0, 0, TAU);
    c.fillStyle = petal; c.fill();

    c.restore();

  const g = c.createRadialGradient(-4, -5, 2, 0, 0, N * 0.14);
  g.addColorStop(0, '#fff09a'); g.addColorStop(1, '#ffb52a');
  c.beginPath(); c.arc(0, 0, N * 0.13, 0, TAU); c.fillStyle = g; c.fill();
  c.fillStyle = 'rgba(215,120,20,0.45)';
  for (let k = 0; k < 12; k++) { const a = k * 2.4, r = Math.sqrt(k / 12) * N * 0.1; c.beginPath(); c.arc(Math.cos(a) * r, Math.sin(a) * r, 1.4, 0, TAU); c.fill(); }

}

function seedMeadow() {
  const dpr = Math.min(2, window.devicePixelRatio || 1);

  meadow.width = MW * dpr; meadow.height = MH * dpr;
  mctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  daisies = [];
  const cell = clamp(MW / 8, 72, 112);
  let row = 0;
  for (let y = -cell * 0.3; y < MH + cell * 0.5; y += cell * 0.78, row++) {
    for (let x = (row % 2) * cell * 0.5 - cell * 0.3; x < MW + cell * 0.5; x += cell) {
      if (Math.random() < 0.9) daisies.push({
        x: x + rand(-0.3, 0.3) * cell, y: y + rand(-0.25, 0.25) * cell,
        s: cell * rand(0.38, 0.72), r: rand(0, TAU), ph: rand(0, TAU), sp: rand(0.6, 1.4),
        img: pick(sprites), la: rand(0, TAU)

}

  const g = mctx.createLinearGradient(0, 0, 0, MH);
  g.addColorStop(0, '#d9f7e3'); g.addColorStop(1, '#addfbd');
  mctx.fillStyle = g; mctx.fillRect(0, 0, MW, MH);
  for (const d of daisies) {

    mctx.save(); mctx.translate(d.x, d.y);
    mctx.fillStyle = '#8fd3a0';
    for (const k of [-1, 1]) {
      mctx.save(); mctx.rotate(d.la + k * 0.9 + sway * 0.5);
      mctx.beginPath(); mctx.ellipse(0, d.s * 0.42, d.s * 0.11, d.s * 0.26, 0, 0, TAU); mctx.fill();

/* ---------- stage ---------- */

    cy: -0.17, half: 1.12, plate: 1.55, pills: ['Color', 'Glitter', 'Wrapper', 'Face', 'Done'] },

/* ---------- needoh ---------- */
function drawSquishy(c, o) {
  const R = o.R, BOT = 0.72 * R, t = o.t, wob = o.wob || 0, kind = o.kind || KIND, dump = kind === 'dumpling';
  c.save();
  c.translate(o.x, o.y);
  c.translate(0, BOT); c.scale(o.sx || 1, o.sy || 1); c.translate(0, -BOT);

  // inside
  c.save();
  bodyPath(c, R, wob, t, kind);
  c.fillStyle = 'rgba(255,255,255,0.6)'; c.fill();
  c.clip();
  if (o.liquid && o.fill > 0) {
    const top = -1.12 * R, bot = 0.76 * R;
    const sy = bot - o.fill * (bot - top + 0.12 * R);
    const amp = R * 0.04 * (1 - o.fill * 0.85);
    c.beginPath(); c.moveTo(-1.4 * R, bot + 10);
    for (let x = -1.4 * R; x <= 1.4 * R + 1; x += R * 0.07) c.lineTo(x, sy + Math.sin(x / R * 4 + t * 3.5) * amp);
    c.lineTo(1.4 * R, bot + 10); c.closePath();
    c.fillStyle = gooStyle(c, o.liquid, R); c.fill();
    // soft doughy shading
    const g = c.createRadialGradient(-0.35 * R, -0.6 * R, 0.1 * R, 0, -0.2 * R, 1.3 * R);
    g.addColorStop(0, 'rgba(255,255,255,0.38)'); g.addColorStop(0.55, 'rgba(255,255,255,0)'); g.addColorStop(1, 'rgba(70,20,80,0.24)');
    c.fillStyle = g; c.fillRect(-1.5 * R, -1.5 * R, 3 * R, 3 * R);
  }
  if (o.glitter) for (const p of o.glitter) {
    if (p.falling) continue;
    const [gx, gy] = glitterXY(p, R, kind);
    spark(c, gx, gy, p.s * R, p.col, 0.55 + 0.45 * Math.sin(t * 4 + p.ph), p.shape, p.ph + t * p.sp);
  }
  // stretchy see-through skin rising from the bottom
  if (o.wrap > 0) {
    const top = -1.16 * R, bot = 0.78 * R;
    const wy = bot - o.wrap * (bot - top + 0.06 * R);
    c.beginPath(); c.moveTo(-1.4 * R, bot + 10); c.lineTo(-1.4 * R, wy);
    if (dump) {
      for (let x = -1.4 * R; x <= 1.4 * R + 1; x += R * 0.05) c.lineTo(x, wy - Math.abs(Math.sin(x / R * 7)) * R * 0.05);
      c.lineTo(1.4 * R, bot + 10); c.closePath();
      const dg = c.createRadialGradient(-0.25 * R, -0.35 * R, 0.1 * R, 0, 0, 1.3 * R);
      dg.addColorStop(0, 'rgba(255,253,248,0.6)'); dg.addColorStop(1, 'rgba(255,240,232,0.32)');
      c.fillStyle = dg; c.fill();
    } else {
      for (let x = -1.4 * R; x <= 1.4 * R + 1; x += R * 0.05) c.lineTo(x, wy + (1 - Math.cos(x / R * 1.8)) * R * 0.08 - Math.sin(x / R * 9 + t * 4) * R * 0.012);
      c.lineTo(1.4 * R, bot + 10); c.closePath();
      const dg = c.createLinearGradient(-R, 0, R, 0);
      dg.addColorStop(0, 'rgba(255,255,255,0.42)'); dg.addColorStop(0.5, 'rgba(255,240,250,0.18)'); dg.addColorStop(1, 'rgba(230,240,255,0.36)');
      c.fillStyle = dg; c.fill();
    }
  }
  c.restore();

  if (o.glitter) for (const p of o.glitter) {
    if (!p.falling) continue;
    const [gx, gy] = glitterXY(p, R, kind);
    spark(c, gx, gy, p.s * R, p.col, 1, p.shape, p.ph + t * 3);
  }

  // shine
  c.fillStyle = 'rgba(255,255,255,0.8)';
  if (dump) {
    c.beginPath(); c.ellipse(-0.6 * R, -0.38 * R, 0.2 * R, 0.09 * R, -0.65, 0, TAU); c.fill();
    c.beginPath(); c.arc(-0.33 * R, -0.62 * R, 0.05 * R, 0, TAU); c.fill();
  } else {
    c.beginPath(); c.ellipse(-0.48 * R, -0.66 * R, 0.2 * R, 0.09 * R, -0.75, 0, TAU); c.fill();
    c.beginPath(); c.arc(-0.2 * R, -0.88 * R, 0.05 * R, 0, TAU); c.fill();
  }

  // once sealed: a glossy rim of light on the skin
  if (dump && o.pleatA > 0) {
    c.save(); c.globalAlpha = o.pleatA;
    c.strokeStyle = 'rgba(91,58,94,0.3)'; c.lineWidth = Math.max(1.2, 0.03 * R); c.lineCap = 'round';
    for (let k = -2; k <= 2; k++) {
      c.beginPath(); c.moveTo(k * 0.05 * R, -1.0 * R);
      c.quadraticCurveTo(k * 0.16 * R, -0.98 * R, k * 0.24 * R, -0.74 * R + Math.abs(k) * 0.08 * R);
      c.stroke();
    }
    c.restore();
  }
  if (!dump && o.pleatA > 0) {
    c.save(); c.globalAlpha = o.pleatA;
    c.strokeStyle = 'rgba(255,255,255,0.75)'; c.lineCap = 'round';
    c.lineWidth = Math.max(2, 0.06 * R);
    c.beginPath(); c.moveTo(0.3 * R, -1.0 * R); c.quadraticCurveTo(0.76 * R, -0.99 * R, 0.79 * R, -0.58 * R); c.stroke();
    c.lineWidth = Math.max(1.5, 0.035 * R);
    c.beginPath(); c.moveTo(0.8 * R, 0.2 * R); c.quadraticCurveTo(0.78 * R, 0.56 * R, 0.5 * R, 0.6 * R); c.stroke();
    c.fillStyle = '#fff';
    star5(c, 0.52 * R, -0.82 * R, 0.07 * R * (1 + 0.3 * Math.sin(t * 5))); c.fill();
    c.restore();
  }

  // outline
  bodyPath(c, R, wob, t, kind);
  c.lineWidth = Math.max(2, 0.055 * R);
  c.strokeStyle = INK;
  c.globalAlpha = o.liquid ? 0.4 + 0.6 * clamp(o.wrap, 0, 1) : 0.45;
  if (!o.liquid) c.setLineDash([R * 0.12, R * 0.1]);
  c.stroke();
  c.setLineDash([]); c.globalAlpha = 1;

  // dumpling knot on top
  if (dump && o.pleatA > 0) {
    c.save(); c.globalAlpha = o.pleatA;
    const ky = -1.08 * R, sc = 0.6 + 0.4 * o.pleatA;
    c.translate(0, ky); c.scale(sc, sc);
    c.fillStyle = '#fff6ee'; c.strokeStyle = INK; c.lineWidth = Math.max(1.6, 0.045 * R);
    c.beginPath(); c.ellipse(0, -0.02 * R, 0.17 * R, 0.1 * R, 0, 0, TAU); c.fill(); c.stroke();
    c.beginPath(); c.arc(0.02 * R, -0.05 * R, 0.05 * R, Math.PI * 0.9, Math.PI * 2.1); c.stroke();
    c.restore();
  }

  if (!dump) { if (o.word) drawWord(c, o.word, R, t); }
  else if (o.face >= 0) { c.globalAlpha = o.faceA == null ? 1 : o.faceA; drawFace(c, o.face, R, t, o.blink == null ? 1 : o.blink, kind); c.globalAlpha = 1; }
  c.restore();
}

  const msg = r.score === 3 ? 'Perfect match! You did it!' : r.score === 2 ? 'So close! 2 out of 3.' : r.score === 1 ? 'Nice try! 1 out of 3.' : 'Good try! Want to go again?';
  return `<div class="result${r.score === 3 ? ' win' : ''}"><div class="stars" role="img" aria-label="${r.score} out of 3 stars">${'★'.repeat(r.score)}<s>${'★'.repeat(3 - r.score)}</s></div><b>${msg}</b><ul class="checks">${r.lines.map(l => `<li class="${l.ok ? 'ok' : 'no'}">${l.ok ? '✓' : '✗'} ${l.t}</li>`).join('')}</ul></div>`;
}

  <div class="row end"><button class="btn ghost" id="skip">No glitter, thanks</button><button class="btn next" id="next" disabled>Next: ${KD.wrap}</button></div>`;
  panel.querySelectorAll('.sw').forEach(b => b.addEventListener('click', () => {
    const g = GLITTERS[+b.dataset.i];
    if (S.goal && S.glitterUsed.length && !S.glitterUsed.includes(g.name)) {
      S.glitter = []; S.glitterUsed = [];
      panel.querySelectorAll('.sw').forEach(x => x.setAttribute('aria-pressed', 'false'));
    }
    S.glitterName = g.name;
    if (!S.glitterUsed.includes(g.name)) S.glitterUsed.push(g.name);

function addGlitter(cols, n) {
  for (let i = 0; i < n; i++) {
    let u, v;
    do { u = rand(-1, 1); v = rand(-1, 1); } while (u * u + v * v > 0.78);
    S.glitter.push({ u: rand(-0.6, 0.6), v: rand(-3.6, -2.3), tu: u, tv: v, bu: u, bv: v, falling: true, vy: rand(0.5, 1.2),
      col: pick(cols), s: rand(0.03, 0.065), shape: (Math.random() * 3) | 0, ph: rand(0, TAU), sp: rand(0.4, 1) });
  }
  if (S.glitter.length > 200) S.glitter.splice(0, S.glitter.length - 200);
}

function renderWrapper() {
  panel.innerHTML = `<h2>Step 3: ${KD.wrapLine}</h2>

}
function updateWrapBar() {
  const b = $('#wrapBar'); if (!b) return;
  b.style.width = Math.round(S.wrap * 100) + '%';
  $('#meter').setAttribute('aria-valuenow', Math.round(S.wrap * 100));
}
function addWrap(d) {
  if (S.step !== 2 || S.wrapDone) return;
  S.wrap = Math.min(1, S.wrap + d);
  P.wob = Math.min(0.05, P.wob + d * 0.25);
  updateWrapBar();
  const tk = Math.floor(S.wrap * 12);
  if (tk > S.tick) { S.tick = tk; Sound.tone(380 + S.wrap * 700, 520 + S.wrap * 800, 0.06, 'sine', 0.08); }
  if (S.wrap >= 1) {
    S.wrapDone = true; hint.hidden = true;
    Sound.pop(); P.qv += 6; P.wob = 0.05;
    const L = layout();
    burst(L.cx, L.cy - 1.05 * L.R, 16, 'spark');
    toast(KD.sealed);
    const g = gen;
    setTimeout(() => { if (g === gen) setStep(3); }, 1000);
  }
}

/* ---------- collection ----------
   Saved to the viewer's own private space in the artifact's database when the page
   runs on claude.ai; falls back to this browser's storage when that isn't available. */
const LOCAL_KEY = 'squishy-maker-collection';
const Col = { items: [], ref: null, open: false, sq: {}, sure: null };
function loadLocal() { try { const a = JSON.parse(localStorage.getItem(LOCAL_KEY) || '[]'); return Array.isArray(a) ? a : []; } catch (e) { return []; } }
function saveLocal() { try { localStorage.setItem(LOCAL_KEY, JSON.stringify(Col.items)); } catch (e) {} }
Col.items = loadLocal();
async function initCollection() {
  try {
    if (!window.claude || typeof claude.use !== 'function') return;
    const [db, user] = await Promise.all([claude.use('db'), claude.use('user')]);
    if (!db || !user) return;
    const id = await user.id();
    if (!id) return;
    const ref = db.collection('data/users/' + id);
    ref.onSnapshot(snap => {
      Col.ref = ref;
      Col.items = snap.docs.map(d => Object.assign({}, d.data(), { id: d.id })).filter(it => it.kind).sort((a, b) => (a.at || 0) - (b.at || 0));
      refreshCollection();
    }, () => { Col.ref = null; });
  } catch (e) { Col.ref = null; }
}
function itemFromCurrent() {
  return {
    id: 'sq' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
    kind: KIND, color: S.color,
    face: KIND === 'dumpling' ? S.face : -1,
    word: KIND === 'needoh' ? S.word : '',
    glitter: S.glitter.slice(-80).map(p => ({ u: +p.bu.toFixed(3), v: +p.bv.toFixed(3), col: p.col, s: +p.s.toFixed(3), shape: p.shape, ph: +p.ph.toFixed(2), sp: +p.sp.toFixed(2) })),
    at: Date.now()
  };
}
async function addToCollection() {
  if (S.saved) return;
  const btn = $('#pSave');
  S.saved = true;
  if (btn) { btn.disabled = true; btn.textContent = 'In your collection ✓'; }
  const it = itemFromCurrent();
  let ok = false;
  if (Col.ref) { try { await Col.ref.doc(it.id).set(it); ok = true; } catch (e) { ok = false; } }
  if (!ok) { Col.items.push(it); saveLocal(); }
  refreshCollection();
  Sound.cheer(); P.qv += 6;
  burst(P.x, P.y - 0.6 * playR(), 14, 'heart');
  toast('Added to your collection!', 2200);
  const cb = $('#colBtn'); cb.animate && cb.animate([{ transform: 'scale(1)' }, { transform: 'scale(1.18)' }, { transform: 'scale(1)' }], { duration: 450 });
}
async function removeItem(id) {
  if (Col.ref) { try { await Col.ref.doc(id).delete(); } catch (e) {} }
  Col.items = Col.items.filter(it => it.id !== id);
  saveLocal();
  refreshCollection();
}
function itemName(it) {
  if (it.kind === 'needoh') return it.word ? it.word : 'Plain Needoh';
  return FACES[it.face] || 'Dumpling';
}
function refreshCollection() {
  $('#colCount').textContent = Col.items.length;
  if (Col.open) buildShelf();
}
function buildShelf() {
  const grid = $('#shelfGrid');
  grid.textContent = '';
  $('#shelfNote').textContent = Col.items.length ? `You have ${Col.items.length} squish${Col.items.length === 1 ? 'y' : 'ies'}. Tap one to squish it.` : '';
  if (!Col.items.length) {
    const e = document.createElement('div'); e.className = 'empty';
    e.innerHTML = '<b>Your collection is empty</b>Make a squishy, then tap “Add to my collection.”';
    grid.appendChild(e); return;
  }
  Col.items.slice().reverse().forEach(it => {
    const tile = document.createElement('div');
    tile.className = 'tile'; tile.tabIndex = 0; tile.setAttribute('role', 'button');
    tile.dataset.id = it.id;
    const cv = document.createElement('canvas'); cv.width = cv.height = 208; cv.setAttribute('aria-hidden', 'true');
    const nm = document.createElement('span'); nm.className = 'nm'; nm.textContent = itemName(it);
    const kd = document.createElement('span'); kd.className = 'kd'; kd.textContent = it.kind === 'needoh' ? 'Needoh' : 'Squishy Dumpling';
    const rm = document.createElement('button'); rm.className = 'rm'; rm.textContent = '×'; rm.setAttribute('aria-label', 'Remove ' + itemName(it));
    rm.addEventListener('click', e => {
      e.stopPropagation();
      if (Col.sure === it.id) { Col.sure = null; Sound.thud(); removeItem(it.id); return; }
      Col.sure = it.id;
      grid.querySelectorAll('.rm').forEach(b => { b.classList.remove('sure'); b.textContent = '×'; });
      rm.classList.add('sure'); rm.textContent = 'Remove?';
      setTimeout(() => { if (Col.sure === it.id) { Col.sure = null; rm.classList.remove('sure'); rm.textContent = '×'; } }, 3000);
    });
    const poke = () => { const q = Col.sq[it.id] || (Col.sq[it.id] = { q: 0, qv: 0 }); q.qv += 7; Sound.squish(); };
    tile.addEventListener('click', poke);
    tile.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); poke(); } });
    tile.append(rm, cv, nm, kd);
    grid.appendChild(tile);
  });
  drawShelf(0);
}
function drawShelf(dt) {
  const byId = {}; Col.items.forEach(it => { byId[it.id] = it; });
  $('#shelfGrid').querySelectorAll('.tile').forEach((tile, i) => {
    const it = byId[tile.dataset.id]; if (!it) return;
    const sq = Col.sq[it.id] || (Col.sq[it.id] = { q: 0, qv: 0 });
    if (dt) { const acc = -300 * sq.q - 9 * sq.qv; sq.qv += acc * dt; sq.q = clamp(sq.q + sq.qv * dt, -0.4, 0.45); }
    const cv = tile.querySelector('canvas'), c = cv.getContext('2d'), N = cv.width;
    c.setTransform(1, 0, 0, 1, 0, 0); c.clearRect(0, 0, N, N);
    const dump = it.kind === 'dumpling', R = dump ? N / 3.1 : N / 2.8;
    const idle = reduce ? 0 : Math.sin(T * 2.2 + i) * 0.015;
    const q = sq.q + idle;
    drawSquishy(c, { kind: it.kind, x: N / 2, y: N * (dump ? 0.66 : 0.68), R, sx: 1 + q * 0.9, sy: 1 - q, t: T + i, wob: 0.006,
      liquid: it.color || '#ffffff', fill: 1, glitter: Array.isArray(it.glitter) ? it.glitter : [], wrap: 1, pleatA: 1,
      face: dump ? (typeof it.face === 'number' ? it.face : 0) : -1, faceA: 1, word: dump ? '' : String(it.word || '').slice(0, 10), blink: blink.B });
  });
}
function placeShelf() { $('#shelf').style.top = $('.top').offsetHeight + 'px'; }
addEventListener('resize', () => { if (Col.open) placeShelf(); });
function openShelf() { if (typeof Chat !== 'undefined' && Chat.open) closeChat(); Col.open = true; Col.sure = null; placeShelf(); $('#shelf').hidden = false; buildShelf(); Sound.bloop(); $('#shelfBack').focus({ preventScroll: true }); }
function closeShelf() { Col.open = false; $('#shelf').hidden = true; $('#colBtn').focus({ preventScroll: true }); }
$('#restartBtn').addEventListener('click', () => {
  if (Chat.open) closeChat();
  try { speechSynthesis.cancel(); } catch (e) {}
  $('#bubble').classList.remove('show'); talkT = 0;
  if (Col.open) closeShelf();
  hint.hidden = true; toastEl.classList.remove('show');
  Sound.bloop();
  reset();
});
$('#colBtn').addEventListener('click', () => Col.open ? closeShelf() : openShelf());
$('#shelfBack').addEventListener('click', closeShelf);
addEventListener('keydown', e => { if (e.key === 'Escape' && Col.open) closeShelf(); });

  if (S.step === 3 && S.mode === 'make') { miniClock += dt; if (miniClock > 0.1) { miniClock = 0; drawMinis(T); } }
  if (Col.open) drawShelf(dt);
  if (Chat.open) drawChatPet(dt);
  drawMeadow(T);
  requestAnimationFrame(frame);
}
reset();
refreshCollection();
initCollection();
requestAnimationFrame(frame);
})();
</script>
